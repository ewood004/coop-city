<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7cc8f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Coup City">
<meta name="description" content="Coup City: a cozy chicken sim for city slickers. Raise hens, collect eggs, and outsmart the hawks."><meta property="og:title" content="Coup City 👑🐔"><meta property="og:description" content="A cozy chicken sim for city slickers. The chickens are in charge."><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<title>Coup City: a chicken sim for city slickers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=11"></head><body>
<div id="app">
 <header id="hud">
  <div class="chip" id="coinStat"><span class="ic">🪙</span><span class="v"><b id="coins">0</b><small>coins</small></span><span id="coinPop"></span></div>
  <div class="chip" id="eggStat"><span class="ic">🥚</span><span class="v"><b id="basketN">0</b><small>eggs</small></span></div>
  <div class="chip" id="feedStat"><span class="ic">🌾</span><span class="v"><b id="feedN">5</b><small>feed</small></span></div>
  <div class="chip" id="cleanStat"><span class="ic">🧹</span><span class="v"><b id="cleanN">100%</b><small>clean</small></span></div>
  <div class="chip" id="clockStat"><span class="ic" id="clockIcon">☀️</span><span class="v"><b id="clock">7am</b><small id="dayLbl">Day <span id="day">1</span></small></span></div>
  <button class="rbtn" id="gearBtn" aria-label="Settings and help">⚙️</button>
 </header>
 <div id="goalbar">
  <button id="lvBadge" aria-label="Farm level and goals"><span class="star">⭐</span><b id="lvN">1</b><span class="xp"><i id="xpFill"></i></span></button>
  <button id="nextBtn"><small id="nextLbl">NEXT</small><span id="goalTxt"></span></button>
  <button id="dqBtn" aria-label="Daily quests"><span id="dqN">🎯3</span><span id="evChip"></span></button>
 </div>
 <div id="grid-wrap"><div id="world"><div id="sky"></div><div id="grid"></div><div id="forage"></div><div id="hens"></div><div id="fx"></div><div id="night"></div><div id="coachMark"><i>👇</i></div></div><div id="mini" aria-hidden="true"></div>
  <div id="dock"><button class="rbtn" id="musicBtn" aria-label="Music on or off">🎵<em>OFF</em></button><button class="rbtn" id="sfxBtn" aria-label="Sound effects on or off">🔊</button></div>
  <button id="recenter" class="rbtn" aria-label="Recenter on coop">🏠</button>
  <button id="scrapBtn" aria-label="Scrap bucket"><span class="bi">🪣</span><span class="bl">Scraps</span><b id="scrapN">0</b></button></div>
 <div id="flockrow"><button id="flockChip" aria-label="Hens and coop space"><span>🐔 <b id="capN">1/3</b></span><small>hens</small></button><div id="henbar"></div></div>
 <div id="actions">
  <button id="lockBtn" class="act"></button>
  <button id="sellBtn" class="act"></button>
  <button id="shopBtn" class="act gold"><span class="ai">🛒</span><span class="al">Shop</span></button>
  <button id="speedBtn" class="act"></button>
 </div>
 <nav id="tools"></nav>
 <div id="guy"><div id="guyArt"></div><div id="bubble" role="button" tabindex="0"><b>Brayden:</b> <span id="bubbleText"></span></div></div>
 <div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>
 <div id="toast" role="status"></div>
 <div id="fly" aria-hidden="true"></div>
</div>
<script src="species.js?v=11"></script><script src="game.js?v=11"></script></body></html>
